<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东方瑞物 SANDUOWEN</title>
    <style>
        /* ================= 基础重置 & 变量 ================= */
        :root {
            --bg-color: #FAF9F6;
            --text-color: #333333;
            --text-light: #666666;
            --font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            overflow-x: hidden;
            /* 隐藏默认光标，启用自定义光标 */
            cursor: none;
        }

        a, .gallery-item {
            cursor: none;
        }

        /* ================= 自定义光标 ================= */
        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        .cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(51, 51, 51, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            /* JS 动态控制延迟跟随 */
            transition: width 0.3s, height 0.3s, border-color 0.3s;
        }

        /* 悬停状态下的光标变化 */
        .cursor-dot.hover { width: 12px; height: 12px; background-color: #a88b77; }
        .cursor-ring.hover { width: 60px; height: 60px; border-color: rgba(168, 139, 119, 0.5); }

        /* ================= 首屏 (Hero) ================= */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.2s;
        }

        .hero p {
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            color: var(--text-light);
            letter-spacing: 0.1em;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.5s;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.5s;
        }

        .scroll-indicator svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--text-light);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: bounce 2s infinite;
        }

        /* ================= 画廊区 (Gallery) ================= */
        .gallery {
            padding: 10vh 10vw;
            display: flex;
            flex-direction: column;
            gap: 20vh; /* 增加纵向间距，配合视差滚动 */
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px; /* 控制图片最大宽度 */
            opacity: 0;
            transform: translateY(60px);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 错落排版 */
        .gallery-item:nth-child(1) { align-self: flex-start; margin-left: 5vw; }
        .gallery-item:nth-child(2) { align-self: flex-end; margin-right: 5vw; }
        .gallery-item:nth-child(3) { align-self: center; }

        /* 视差滚动容器 */
        .img-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 4px;
            /* 视差滚动核心属性，JS 会覆盖 */
            transform: translateY(0); 
        }

        .img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.8s ease;
            /* 柔化边缘，模拟玉石/纸张质感 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }

        /* 呼吸感悬浮 (Hover) */
        .gallery-item:hover .img-wrapper img {
            transform: scale(1.03);
            box-shadow: 0 15px 40px rgba(168, 139, 119, 0.15); /* 模拟玉石柔光 */
        }

        /* 文字排版 */
        .text-content {
            margin-top: 30px;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 15px;
            transition: border-color 0.5s ease;
        }

        .gallery-item:hover .text-content {
            border-color: rgba(168, 139, 119, 0.3);
        }

        .text-content .cn {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            color: var(--text-color);
        }

        .text-content .en {
            font-size: 0.85rem;
            color: var(--text-light);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* ================= 动画关键帧 ================= */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .gallery { padding: 10vh 5vw; gap: 12vh; }
            .gallery-item { align-self: center !important; margin: 0 !important; width: 100%; }
            .text-content { flex-direction: column; align-items: flex-start; gap: 8px; }
            body { cursor: auto; } /* 移动端恢复默认光标 */
            .cursor-dot, .cursor-ring { display: none; }
        }
    </style>
</head>
<body>

    <!-- 自定义光标 -->
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <!-- 首屏 -->
    <header class="hero">
        <h1>东方瑞物 SANDUOWEN</h1>
        <p>新中式视觉探索 · 传统元素的现代转译</p>
        <div class="scroll-indicator">
            <svg viewBox="0 0 24 24">
                <path d="M12 5v14M19 12l-7 7-7-7"/>
            </svg>
        </div>
    </header>

    <!-- 画廊区 -->
    <main class="gallery">
        
        <!-- Pic 1 -->
        <div class="gallery-item">
            <div class="img-wrapper">
                <img src="pic1.jpg" alt="榴绽繁花">
            </div>
            <div class="text-content">
                <span class="cn">榴绽繁花，万事圆满</span>
                <span class="en">Pomegranate</span>
            </div>
        </div>

        <!-- Pic 2 -->
        <div class="gallery-item">
            <div class="img-wrapper">
                <img src="pic2.jpg" alt="桃献遐龄">
            </div>
            <div class="text-content">
                <span class="cn">桃献遐龄，岁岁安和</span>
                <span class="en">Peach</span>
            </div>
        </div>

        <!-- Pic 3 -->
        <div class="gallery-item">
            <div class="img-wrapper">
                <img src="pic3.jpg" alt="佛手拈祥">
            </div>
            <div class="text-content">
                <span class="cn">佛手拈祥，福伴朝夕</span>
                <span class="en">Buddha's Hand</span>
            </div>
        </div>

    </main>

    <script>
        // ================= 1. 自定义光标延迟跟随 =================
        const dot = document.querySelector('.cursor-dot');
        const ring = document.querySelector('.cursor-ring');
        
        let mouseX = 0, mouseY = 0; // 鼠标实际位置
        let ringX = 0, ringY = 0;   // 外圈当前位置
        
        // 监听鼠标移动
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // 内圈没有延迟，直接跟随
            dot.style.left = `${mouseX}px`;
            dot.style.top = `${mouseY}px`;
        });

        // 使用 requestAnimationFrame 实现外圈平滑延迟跟随
        function animateCursor() {
            // 0.15 是延迟系数，数值越小越顺滑（惯性越大）
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;
            
            ring.style.left = `${ringX}px`;
            ring.style.top = `${ringY}px`;
            
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // 悬停到作品上时的光标状态切换
        const galleryItems = document.querySelectorAll('.gallery-item');
        galleryItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                dot.classList.add('hover');
                ring.classList.add('hover');
            });
            item.addEventListener('mouseleave', () => {
                dot.classList.remove('hover');
                ring.classList.remove('hover');
            });
        });


        // ================= 2. 滚动视差与入场动画 =================
        // 使用 IntersectionObserver 实现滚动到视口时的平滑淡入 (替代生硬的 scroll 监听)
        const observerOptions = {
            root: null,
            rootMargin: '0px 0px -15% 0px', // 元素露出 85% 时触发
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                    observer.unobserve(entry.target); // 动画只执行一次
                }
            });
        }, observerOptions);

        galleryItems.forEach(item => {
            observer.observe(item);
        });

        // 视差滚动核心逻辑 (Parallax)
        const imgWrappers = document.querySelectorAll('.img-wrapper');
        
        window.addEventListener('scroll', () => {
            // 获取当前滚动距离
            const scrollY = window.scrollY;
            
            imgWrappers.forEach(wrapper => {
                // 获取元素距离页面顶部的距离
                const wrapperTop = wrapper.getBoundingClientRect().top + scrollY;
                // 获取视口高度
                const windowHeight = window.innerHeight;
                
                // 计算偏移量：只有当元素进入视口或即将进入视口时才计算
                if (scrollY + windowHeight > wrapperTop && scrollY < wrapperTop + wrapper.offsetHeight) {
                    // 核心视差公式：(视口中心点 - 元素中心点) * 速率
                    const distanceToCenter = (scrollY + windowHeight / 2) - (wrapperTop + wrapper.offsetHeight / 2);
                    // 0.08 是视差速度系数，数值越大移动越明显
                    const parallaxY = distanceToCenter * 0.08; 
                    
                    // 将计算出的位移应用到内部 img-wrapper 上
                    wrapper.style.transform = `translateY(${parallaxY}px)`;
                }
            });
        });
        
        // 初始触发一次计算，防止刷新时位置不对
        window.dispatchEvent(new Event('scroll'));
    </script>
</body>
</html>
